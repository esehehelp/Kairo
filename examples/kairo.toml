database_path = "local/kairo-v3.db"
listen = "127.0.0.1:7474"
advertise_url = "http://127.0.0.1:7474"
log_directory = "local/attempts-v3"
log_min_free_mib = 1024  # launch nothing while log_directory's filesystem has less free
observe_only = true
observation_interval_seconds = 5

# Admission (README "Admission"): a node with a filesystem under this much
# free space (at most 5% of it) admits nothing; 0 turns it off.
[scheduler]
disk_min_free_bytes = 5368709120

[node]
id = "windows-host-1"
name = "windows-host-1"
os = "windows"
architecture = "amd64"
labels = { site = "local" }

# Hardware benches (README "Hardware benches"): where the bench programs of
# this node are. kairo_binary defaults to this kairo; without gpu_binary the
# node takes no GPU bench. executor_labels pick the executor that runs them
# natively (not WSL, for these Windows paths).
[bench]
gpu_binary = "D:/Kairo/kairo-bench-gpu.exe"
executor_labels = { environment = "windows" }

[[executors]]
id = "windows-local"
kind = "windows"
labels = { environment = "windows" }

[[executors]]
id = "ubuntu-wsl"
kind = "wsl2"
labels = { environment = "wsl2", distro = "Ubuntu", nccl = "true" }

[[providers]]
id = "nvidia-local"
kind = "nvidia"
observation_ttl_seconds = 15

[[providers]]
id = "host-local"
kind = "host"
observation_ttl_seconds = 15

[[providers]]
id = "filesystem-local"
kind = "filesystem"
filesystems = ["D:"]
observation_ttl_seconds = 15
