# The PostgreSQL database (README "Database"). KAIRO_DATABASE_URL may give it
# instead, and database_password_file its password.
database_url = "postgres://kairo@127.0.0.1:5432/kairo?sslmode=disable"
listen = "127.0.0.1:7474"
advertise_url = "http://127.0.0.1:7474"
log_directory = "local/attempts-v3"
log_min_free_mib = 1024  # launch nothing while log_directory's filesystem has less free
# control_snapshot_minutes = 60  # snapshot the control plane into the durable stores this often (negative: never)
# pg_dump = "/usr/bin/pg_dump"   # the pg_dump the snapshot dumps the database with (default: on PATH)
observe_only = true
observation_interval_seconds = 5

# Admission (README "Admission"): a node with a filesystem under this much
# free space (at most 5% of it) admits nothing; 0 turns it off.
[scheduler]
disk_min_free_bytes = 5368709120

[node]
id = "win-node"
name = "win-node"
os = "windows"
architecture = "amd64"
labels = { site = "local" }

# The daemon runs no jobs: [[executors]] and [[providers]] are a node
# agent's (README "Node agents"), whose containers run the work.
