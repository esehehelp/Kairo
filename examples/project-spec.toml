schema_version = 1

[project]
name = "example-project"

# Every task runs in a container: its image, and the project's code
# (a snapshot of this directory, read-only at /kairo/src).
[images.uv]
ref = "ghcr.io/astral-sh/uv:python3.12-bookworm"

[sources.example-project]
root = "."
paths = ["src", "configs", "pyproject.toml", "uv.lock"]

[[tasks]]
name = "train"
queue = "training"
depends_on = []
policy = "RunToCompletion@v1"

[tasks.execution]
schema_version = 2
argv = ["uv", "run", "project", "train", "--config", "configs/train/model-v1.toml"]
image = "uv"
source = "example-project"
cwd = "."
priority = 10
checkpointable = true
preemptible = true

[tasks.execution.executor]
labels = { site = "host-a" }

[[tasks.execution.exclusive]]
kind = "gpu"
count = 1
same_node = true
min_total_memory_bytes = 0
min_observed_free_memory_bytes = 0
on_external_claim = "wait"
on_unattributed_activity = "wait"
on_stale_observation = "wait"

[tasks.execution.capacity]
cpu_millis = 4000
ram_bytes = 17179869184
strength = "admitted"

[[tasks]]
name = "export"
queue = "artifacts"
depends_on = ["train"]
policy = "RunToCompletion@v1"

[tasks.execution]
schema_version = 2
argv = ["uv", "run", "project", "export", "--config", "configs/export/model-v1.toml"]
image = "uv"
source = "example-project"
cwd = "."
priority = 10
checkpointable = false
preemptible = false

[tasks.execution.executor]
labels = { site = "host-a" }

[[tasks.execution.exclusive]]
kind = "gpu"
count = 1
same_node = true
min_total_memory_bytes = 0
min_observed_free_memory_bytes = 0
on_external_claim = "wait"
on_unattributed_activity = "wait"
on_stale_observation = "wait"

[tasks.execution.capacity]
cpu_millis = 4000
ram_bytes = 17179869184
strength = "admitted"
