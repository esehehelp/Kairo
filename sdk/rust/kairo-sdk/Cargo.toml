[package]
name = "kairo-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Worker SDK for Kairo-managed jobs: the attempt environment, the worker API client, heartbeats, progress reporting and suspend safe points."
repository = "https://github.com/esehehelp/Kairo"
publish = false

[lib]
name = "kairo_sdk"
path = "src/lib.rs"

[features]
# install_stop_handlers(): SIGTERM (Unix) and CTRL_BREAK (Windows) request a stop that safe_point honours.
signals = ["dep:libc", "windows-sys/Win32_System_Console"]

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (ring) with the webpki roots; the daemon's own CA comes from KAIRO_API_CA.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# the same rustls as ureq's: a TLS 1.3-only ring provider and X.509 checks of KAIRO_API_CA
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
